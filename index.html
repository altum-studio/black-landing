    <script>
      // Decide la intro antes del primer pintado (el HTML llega pre-renderizado).
      // ONCE en true: sólo la primera carga de cada pestaña; en false (modo revisión) siempre.
      ;(function () {
        var d = document.documentElement
        d.classList.remove('no-js')
        var ONCE = false
        var show = !matchMedia('(prefers-reduced-motion: reduce)').matches
        if (ONCE && show) {
          try {
            show = !sessionStorage.getItem('black-intro')
            if (show) sessionStorage.setItem('black-intro', '1')
          } catch (e) {}
        }
        d.style.setProperty('--hero-delay', show ? '3.95s' : '0s')
        if (show) d.classList.add('is-loading', 'has-intro')
      })()
    </script>
